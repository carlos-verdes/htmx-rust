[workspace]
members = [".", "demo"]

[package]
name = "htmx-rust"
version = "0.0.2"
edition = "2024"
license = "MIT"
description = "Server-rendered Rust web apps with htmx and maud: routing, URL as state, components"
repository = "https://github.com/funkode-io/htmx-rust"
homepage = "https://github.com/funkode-io/htmx-rust"
readme = "README.md"
keywords = ["htmx", "maud", "ssr", "web", "axum"]
categories = ["web-programming"]
exclude = ["/browser-tests"]

[features]
default = ["maud"]
maud = ["dep:maud"]

[dependencies]
axum = { version = "0.8", default-features = false }
form_urlencoded = "1"
maud = { version = "0.27", optional = true }
serde = "1"
serde_urlencoded = "0.7"

[dev-dependencies]
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
